services:

  # ---- FREE VPN TUNNEL (Gluetun) ----
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./gluetun:/gluetun
    env_file:
      - .env
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
    ports:
      - 8080:8080 # Exposes qBittorrent securely through the VPN
    restart: unless-stopped

  # ---- SECURE FREE DOWNLOADER ----
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun" # Forces all torrent traffic through Proton VPN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TEMPORARY_PASSWORD=${QBITTORRENT_PASSWORD} 
    volumes:
      - ./qbittorrent/config:/config
      - C:\movies:/downloads # Downloads go straight into your Windows C:\movies folder
    depends_on:
      - gluetun
    restart: unless-stopped

  # ---- 100% OPEN-SOURCE MEDIA SERVER ----
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    # network_mode: host # Allows your Samsung TV to auto-discover your laptop easily
    ports:
      - 8096:8096 # Backup port exposure for Windows Docker setups
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - C:\movies:/media/movies # Jellyfin reads directly from your Windows C:\movies folder
    restart: unless-stopped
